# CI do FilaSUS (SCRUM-69): build e testes do back-end e do front-end
# em todo push e todo pull request.
name: CI

on:
  push:
  pull_request:

# Cancela execuções antigas da mesma branch/PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL de teste: os testes rodam contra um banco real, igual ao de produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: filasus_test
          POSTGRES_USER: filasus
          POSTGRES_PASSWORD: filasus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filasus -d filasus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variáveis de ambiente têm prioridade sobre o application-test.properties,
    # então no CI o perfil "test" usa o PostgreSQL acima em vez do H2.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/filasus_test
      SPRING_DATASOURCE_USERNAME: filasus
      SPRING_DATASOURCE_PASSWORD: filasus_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

  frontend:
    name: Front-end (npm ci, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

  # Check único "build" exigido nas branches protegidas (main e develop).
  # Só passa se back-end e front-end passarem.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Conferir resultado
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Back-end: ${{ needs.backend.result }} | Front-end: ${{ needs.frontend.result }}"
            exit 1
          fi
