# Deploy em homologação do FilaSUS (SCRUM-120), sem Docker:
# back-end no Koyeb, banco no Neon e front-end no Netlify.
#
# Quem chama este workflow é o CI (ci.yml), só depois que todos os testes passam
# num push na develop. Assim uma versão quebrada não vai para a homologação.
# Também dá para rodar à mão em Actions → Deploy em homologação → Run workflow.
name: Deploy em homologação

on:
  workflow_call:
  workflow_dispatch:

# O token do GitHub só precisa ler o repositório.
permissions:
  contents: read

# Um deploy de cada vez: se chegar outro merge, ele espera o atual terminar.
concurrency:
  group: deploy-homolog
  cancel-in-progress: false

env:
  # Versões fixas, para o deploy não mudar sozinho quando sair uma versão nova.
  KOYEB_CLI_VERSAO: '5.12.0'
  NETLIFY_CLI_VERSAO: '27.15.0'

jobs:
  backend:
    name: Back-end (Koyeb)
    runs-on: ubuntu-latest

    # O token fica só em Settings → Secrets and variables → Actions.
    env:
      KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}

    steps:
      - name: Instalar a CLI do Koyeb
        run: |
          arquivo="koyeb-cli_${KOYEB_CLI_VERSAO}_linux_amd64.tar.gz"
          curl -fsSL -o "$arquivo" "https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSAO}/$arquivo"
          mkdir -p "$HOME/.koyeb/bin"
          tar -xzf "$arquivo" -C "$HOME/.koyeb/bin" koyeb
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      # O Koyeb baixa a develop, compila o backend/ com o buildpack de Java e publica.
      - name: Publicar o back-end
        run: koyeb services redeploy backend --app filasus --token "$KOYEB_TOKEN" --wait --wait-timeout 15m

  frontend:
    name: Front-end (Netlify)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend

    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # Endereço público do back-end no Koyeb (Settings → Variables → Actions).
      API_URL: ${{ vars.HOMOLOG_API_URL }}

    steps:
      - uses: actions/checkout@v4

      # A CLI do Netlify exige Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      # O Netlify repassa as chamadas da API para o Koyeb, então o sistema usa um
      # endereço só e não precisa de CORS. A última regra faz as rotas de tela abrirem.
      - name: Regras de redirecionamento do Netlify
        run: |
          if [ -z "$API_URL" ]; then
            echo "Falta a variável HOMOLOG_API_URL com o endereço do back-end."
            exit 1
          fi
          {
            echo "/auth/*       $API_URL/auth/:splat       200!"
            echo "/api/*        $API_URL/api/:splat        200!"
            echo "/pacientes/*  $API_URL/pacientes/:splat  200!"
            echo "/*            /index.html                200"
          } > dist/_redirects
          cat dist/_redirects

      - name: Publicar o front-end
        run: npx --yes "netlify-cli@${NETLIFY_CLI_VERSAO}" deploy --prod --no-build --dir=dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
