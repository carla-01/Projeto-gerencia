spring.application.name=filasus

# Banco PostgreSQL local. Os valores vêm de variáveis de ambiente;
# o que está depois dos dois-pontos é o padrão do ambiente de desenvolvimento.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/filasus}
spring.datasource.username=${DB_USER:filasus}
spring.datasource.password=${DB_PASSWORD:filasus_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo do JWT (usado a partir da US01). Nunca commitar o valor real.
jwt.secret=${JWT_SECRET:troque-por-um-texto-longo-e-aleatorio-123456}
# Tempo de validade do token gerado no login.
jwt.expiracao-minutos=60

# Chaves que protegem o CPF no banco (DA-SEG-I3-01). Nunca commitar os valores reais.
# Se a chave de cifra mudar, os CPFs já cadastrados não abrem mais.
cpf.chave-hash=${CPF_CHAVE_HASH:chave-hash-do-cpf-so-para-desenvolvimento}
cpf.chave-cifra=${CPF_CHAVE_CIFRA:chave-cifra-do-cpf-so-para-desenvolvimento}

server.port=8080
management.endpoints.web.exposure.include=health
