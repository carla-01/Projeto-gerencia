# Perfil usado nos testes: banco H2 em memória, sem PostgreSQL e sem Docker.
# No CI as variáveis SPRING_DATASOURCE_* trocam o H2 por um PostgreSQL de teste.
spring.datasource.url=jdbc:h2:mem:filasus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=segredo-apenas-para-testes-do-ci-0123456789abcdef
# Cada classe com relógio próprio sobe outro contexto do Spring, com o seu pool de conexões.
# Com 10 por pool (o padrão), o PostgreSQL do CI passa das 100 conexões dele.
spring.datasource.hikari.maximum-pool-size=3
