# Perfil usado nos testes: banco H2 em memória, sem PostgreSQL e sem Docker.
# No CI as variáveis SPRING_DATASOURCE_* trocam o H2 por um PostgreSQL de teste.
spring.datasource.url=jdbc:h2:mem:filasus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=segredo-apenas-para-testes-do-ci-0123456789abcdef
